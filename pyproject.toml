[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bnpl-cash-flow-tracker"
version = "0.1.0"
description = "BNPL Cash Flow Tracker"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.41,<2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
